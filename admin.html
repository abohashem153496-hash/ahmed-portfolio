<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الاحترافية - أحمد أبوهاشم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto mt-24 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
        <h1 class="text-2xl font-black mb-4 text-blue-400">منطقة التحكم الإدارية</h1>
        <p class="text-slate-400 text-sm mb-6">أدخل كلمة المرور السرية (ahmed123)</p>
        <input type="password" id="inp-pass" placeholder="كلمة المرور..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-center mb-4 focus:outline-none focus:border-blue-500">
        <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl transition shadow-lg">تسجيل الدخول</button>
    </div>

    <!-- لوحة التحكم الاحترافية -->
    <div id="admin-panel" class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl hidden space-y-8">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-blue-400">لوحة إدارة الموقع الشاملة ⚙️</h1>
            <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1.5 rounded-lg">متصل بقاعدة البيانات</span>
        </div>
        
        <div class="space-y-6">
            <!-- 1. الهيدر والعنوان الرئيسي -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">1. الواجهة الرئيسية (Hero Section)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">عنوان المتصفح (Title)</label>
                        <input type="text" id="inp-title" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">اسم الشعار (Logo)</label>
                        <input type="text" id="inp-logo" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">العنوان الرئيسي البارز</label>
                    <textarea id="inp-heroTitle" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">نبذة تعريفية سريعة</label>
                    <textarea id="inp-heroSubtitle" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white"></textarea>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">رقم الواتساب للتواصل (مثال: 201124793700)</label>
                    <input type="text" id="inp-whatsapp" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
            </div>

            <!-- 2. قسم نبذة عني -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">2. قسم نبذة عني (About Me)</h2>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">عنوان القسم</label>
                    <input type="text" id="inp-aboutTitle" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">التفاصيل والخبرات المهنية</label>
                    <textarea id="inp-aboutText" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white"></textarea>
                </div>
            </div>

            <!-- 3. قسم خدماتي -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">3. خدماتي الاحترافية (Services)</h2>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">خدمة 1 (العنوان والتفاصيل مفصولين بـ |)</label>
                    <input type="text" id="inp-service1" placeholder="تصميم الهويات البصرية | إبداع بصري متكامل..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">خدمة 2</label>
                    <input type="text" id="inp-service2" placeholder="برمجة وتطوير المتاجر | حلول رقمية..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">خدمة 3</label>
                    <input type="text" id="inp-service3" placeholder="حلول إكسيل المتقدمة | قواعد بيانات VBA..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
            </div>

            <!-- 4. الألوان والوسائط -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">4. التصميم والوسائط</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">لون الخلفية</label>
                        <input type="color" id="inp-bgColor" value="#0f172a" class="w-full h-12 bg-slate-800 border border-slate-700 rounded-xl p-1 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">اللون الأساسي للأزرار</label>
                        <input type="color" id="inp-primaryColor" value="#3b82f6" class="w-full h-12 bg-slate-800 border border-slate-700 rounded-xl p-1 cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">رابط صورة أو بانر إضافي</label>
                    <input type="text" id="inp-imageUrl" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                </div>
            </div>

            <button onclick="saveChanges()" class="w-full bg-blue-600 hover:bg-blue-500 font-black text-lg py-4 rounded-2xl transition shadow-2xl">حفظ ونشر التحديثات فوراً 🚀</button>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.checkPassword = function() {
            if(document.getElementById('inp-pass').value === "ahmed123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert('كلمة المرور غير صحيحة!'); }
        };

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('inp-title').value = data.title || '';
                document.getElementById('inp-logo').value = data.logo || '';
                document.getElementById('inp-heroTitle').value = data.heroTitle || '';
                document.getElementById('inp-heroSubtitle').value = data.heroSubtitle || '';
                document.getElementById('inp-whatsapp').value = data.whatsapp || '201124793700';
                document.getElementById('inp-aboutTitle').value = data.aboutTitle || '';
                document.getElementById('inp-aboutText').value = data.aboutText || '';
                document.getElementById('inp-service1').value = data.service1 || '';
                document.getElementById('inp-service2').value = data.service2 || '';
                document.getElementById('inp-service3').value = data.service3 || '';
                document.getElementById('inp-bgColor').value = data.bgColor || '#0f172a';
                document.getElementById('inp-primaryColor').value = data.primaryColor || '#3b82f6';
                document.getElementById('inp-imageUrl').value = data.imageUrl || '';
            }
        });

        window.saveChanges = function() {
            set(ref(db, 'settings'), {
                title: document.getElementById('inp-title').value,
                logo: document.getElementById('inp-logo').value,
                heroTitle: document.getElementById('inp-heroTitle').value,
                heroSubtitle: document.getElementById('inp-heroSubtitle').value,
                whatsapp: document.getElementById('inp-whatsapp').value,
                aboutTitle: document.getElementById('inp-aboutTitle').value,
                aboutText: document.getElementById('inp-aboutText').value,
                service1: document.getElementById('inp-service1').value,
                service2: document.getElementById('inp-service2').value,
                service3: document.getElementById('inp-service3').value,
                bgColor: document.getElementById('inp-bgColor').value,
                primaryColor: document.getElementById('inp-primaryColor').value,
                imageUrl: document.getElementById('inp-imageUrl').value
            }).then(() => {
                alert('تم تحديث الموقع ونشره بنجاح تام يا أحمد! 🌟');
            }).catch((error) => { alert('خطأ: ' + error.message); });
        }
    </script>
</body>
</html>
