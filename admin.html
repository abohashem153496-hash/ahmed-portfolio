<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الإدارية - Sports House & Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto mt-24 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
        <h1 class="text-2xl font-black mb-4 text-blue-400">تسجيل دخول المدير العام</h1>
        <p class="text-slate-400 text-sm mb-6">أدخل كلمة المرور السرية (ahmed123)</p>
        <input type="password" id="inp-pass" placeholder="كلمة المرور..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-center mb-4 focus:outline-none focus:border-blue-500">
        <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl transition shadow-lg">دخول لوحة التحكم</button>
    </div>

    <!-- لوحة التحكم الاحترافية -->
    <div id="admin-panel" class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl hidden space-y-8">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-blue-400">Sports House | إدارة المتجر والطباعة ⚙️</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-lg">متصل بالسحابة</span>
        </div>
        
        <div class="space-y-6">
            <!-- 1. الإعدادات العامة للمتجر -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">1. الإعدادات العامة، الغلاف والألوان</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">اسم المتجر</label>
                        <input type="text" id="inp-storeName" value="Sports House c Ahmed elghool" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">رقم الواتساب للطلبات</label>
                        <input type="text" id="inp-whatsapp" value="201124793700" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">صورة الغلاف (Banner)</label>
                        <input type="file" id="file-cover" accept="image/*" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-300 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">لون خلفية المتجر</label>
                        <input type="color" id="inp-bgColor" value="#020617" class="w-full h-11 bg-slate-800 border border-slate-700 rounded-xl p-1 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">اللون الأساسي</label>
                        <input type="color" id="inp-primaryColor" value="#3b82f6" class="w-full h-11 bg-slate-800 border border-slate-700 rounded-xl p-1 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 2. لوحة تحكم قسم الطباعة المتخصصة (إضافة أعمال طباعة جديدة) -->
            <div class="bg-indigo-950/30 p-5 rounded-2xl border border-indigo-500/40 space-y-4 shadow-lg">
                <div class="flex items-center justify-between border-b border-indigo-500/30 pb-2">
                    <h2 id="print-form-title" class="font-bold text-indigo-300 text-lg">🖨️ لوحة تحكم قسم الطباعة (رفع صور، فيديوهات، وأعداد)</h2>
                </div>
                <input type="hidden" id="edit-product-id" value="">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">عنوان خدمة أو تصميم الطباعة</label>
                        <input type="text" id="new-title" placeholder="مثال: طباعة تيشرتات يونيفورم شركات..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">السعر أو التكلفة</label>
                        <input type="text" id="new-price" placeholder="مثال: حسب الكمية أو 150 ج.م" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">صور الطباعة (اختر عدة صور دفعة واحدة)</label>
                        <input type="file" id="new-img-files" accept="image/*" multiple class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-300 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">رابط فيديو لشغل الطباعة (اختياري)</label>
                        <input type="text" id="new-video" placeholder="رابط يوتيوب..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">الكمية أو الحد الأدنى للطلب</label>
                        <input type="number" id="new-stock" placeholder="مثال: 50 قطعة" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">القسم التابع له</label>
                        <select id="new-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                            <option value="printing" selected>🖨️ قسم الطباعة والتصاميم</option>
                            <option value="offers">🔥 العروض الخاصة</option>
                            <option value="sets">⚽ الأطقم الرياضية</option>
                            <option value="pieces">👕 القطع الفردية</option>
                            <option value="stretches">⚡ الاستريزات</option>
                            <option value="sports">🏃‍♂️ ملابس رياضية متنوعة</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">تفاصيل أو مقاسات الطباعة</label>
                        <input type="text" id="new-sizes" placeholder="A4, A3, متاح كافة المقاسات" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
                    </div>
                </div>

                <div class="flex gap-4">
                    <button onclick="saveProduct()" id="save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl transition shadow-lg">حفظ ونشر في قسم الطباعة 🖨️</button>
                    <button onclick="cancelEdit()" id="cancel-btn" class="hidden bg-slate-700 hover:bg-slate-600 font-bold px-6 py-3.5 rounded-xl transition">إلغاء</button>
                </div>
            </div>

            <!-- 3. قائمة المنتجات والطباعة المنشورة -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                <h2 class="font-bold text-blue-300 text-lg">3. إدارة المنتجات وأعمال الطباعة المنشورة</h2>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>

            <button onclick="saveGlobalSettings()" class="w-full bg-blue-600 hover:bg-blue-500 font-black text-lg py-4 rounded-2xl transition shadow-2xl">حفظ إعدادات المتجر العامة والغلاف والألوان 🚀</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let productsData = {};
        let currentCover = '';

        window.checkPassword = function() {
            if(document.getElementById('inp-pass').value === "ahmed123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert('كلمة المرور غير صحيحة!'); }
        };

        onValue(ref(db, 'store'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('inp-storeName').value = data.storeName || 'Sports House c Ahmed elghool';
                document.getElementById('inp-whatsapp').value = data.whatsapp || '201124793700';
                document.getElementById('inp-bgColor').value = data.bgColor || '#020617';
                document.getElementById('inp-primaryColor').value = data.primaryColor || '#3b82f6';
                currentCover = data.coverImg || '';
                productsData = data.products || {};
                
                const listEl = document.getElementById('admin-products-list');
                listEl.innerHTML = '';
                Object.keys(productsData).forEach(id => {
                    const prod = productsData[id];
                    const firstImg = (prod.images && prod.images.length > 0) ? prod.images[0] : (prod.img || 'https://via.placeholder.com/100');
                    listEl.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <div class="flex items-center gap-3">
                                <img src="${firstImg}" class="w-12 h-12 object-cover rounded-lg">
                                <div>
                                    <h4 class="font-bold text-sm">${prod.title} <span class="text-xs text-indigo-400">(${prod.category || 'عام'})</span></h4>
                                    <p class="text-xs text-slate-400">${prod.price} | صور: ${prod.images ? prod.images.length : 1}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="startEdit('${id}')" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-2 rounded-lg font-bold">تعديل</button>
                                <button onclick="deleteProduct('${id}')" class="bg-red-600 hover:bg-red-500 text-xs px-3 py-2 rounded-lg font-bold">حذف</button>
                            </div>
                        </div>
                    `;
                });
            }
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 600;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.saveProduct = async function() {
            const editId = document.getElementById('edit-product-id').value;
            const title = document.getElementById('new-title').value;
            const price = document.getElementById('new-price').value;
            const video = document.getElementById('new-video').value;
            const stock = document.getElementById('new-stock').value;
            const category = document.getElementById('new-category').value;
            const sizes = document.getElementById('new-sizes').value;
            const fileInput = document.getElementById('new-img-files');

            if(!title || !price) { alert('أدخل العنوان والسعر!'); return; }

            let imagesList = editId && productsData[editId].images ? productsData[editId].images : [];
            if(editId && productsData[editId].img && imagesList.length === 0) {
                imagesList.push(productsData[editId].img);
            }

            if (fileInput.files && fileInput.files.length > 0) {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const compressed = await compressImage(fileInput.files[i]);
                    imagesList.push(compressed);
                }
            }

            if(imagesList.length === 0) {
                imagesList.push('https://via.placeholder.com/400');
            }

            const productData = { title, price, images: imagesList, img: imagesList[0], video, stock, category, sizes };

            if(editId) {
                await update(ref(db, `store/products/${editId}`), productData);
                alert('تم التعديل بنجاح!');
                cancelEdit();
            } else {
                await push(ref(db, 'store/products'), productData);
                alert('تم النشر في قسم الطباعة بنجاح! 🖨️');
            }

            document.getElementById('new-title').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-video').value = '';
            document.getElementById('new-stock').value = '';
            document.getElementById('new-sizes').value = '';
            document.getElementById('new-img-files').value = '';
        };

        window.startEdit = function(id) {
            const prod = productsData[id];
            document.getElementById('edit-product-id').value = id;
            document.getElementById('new-title').value = prod.title || '';
            document.getElementById('new-price').value = prod.price || '';
            document.getElementById('new-video').value = prod.video || '';
            document.getElementById('new-stock').value = prod.stock || '';
            document.getElementById('new-category').value = prod.category || 'printing';
            document.getElementById('new-sizes').value = prod.sizes || '';
            document.getElementById('print-form-title').innerText = "تعديل قسم أو عمل الطباعة ✏️";
            document.getElementById('save-btn').innerText = "حفظ التعديلات 💾";
            document.getElementById('cancel-btn').classList.remove('hidden');
        };

        window.cancelEdit = function() {
            document.getElementById('edit-product-id').value = '';
            document.getElementById('new-title').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-video').value = '';
            document.getElementById('new-stock').value = '';
            document.getElementById('new-sizes').value = '';
            document.getElementById('print-form-title').innerText = "🖨️ لوحة تحكم قسم الطباعة (رفع صور، فيديوهات، وأعداد)";
            document.getElementById('save-btn').innerText = "حفظ ونشر في قسم الطباعة 🖨️";
            document.getElementById('cancel-btn').classList.add('hidden');
        };

        window.deleteProduct = function(id) {
            if(confirm('حذف هذا العمل؟')) remove(ref(db, `store/products/${id}`));
        };

        window.saveGlobalSettings = async function() {
            const coverInput = document.getElementById('file-cover');
            let coverImg = currentCover;

            if (coverInput.files && coverInput.files[0]) {
                coverImg = await compressImage(coverInput.files[0]);
            }

            set(ref(db, 'store/storeName'), document.getElementById('inp-storeName').value);
            set(ref(db, 'store/whatsapp'), document.getElementById('inp-whatsapp').value);
            set(ref(db, 'store/bgColor'), document.getElementById('inp-bgColor').value);
            set(ref(db, 'store/primaryColor'), document.getElementById('inp-primaryColor').value);
            set(ref(db, 'store/coverImg'), coverImg).then(() => {
                alert('تم حفظ إعدادات المتجر العامة والغلاف والألوان بنجاح! 🚀');
            });
        }
    </script>
</body>
</html>
