<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports House c Capt Ahmed elghool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Montserrat:wght@700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: #020617; overflow-x: hidden; }
        .custom-store-font { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- شريط المتجر العلوي -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div id="store-logo" class="text-lg md:text-2xl font-black text-blue-400 truncate max-w-[200px]">Sports House</div>
            <button onclick="toggleCart()" class="relative bg-slate-900 border border-slate-700 hover:border-blue-500 text-white px-3 py-2 rounded-xl transition flex items-center gap-2 font-bold text-sm">
                <i class="fas fa-shopping-cart text-base text-blue-400"></i>
                <span>السلة</span>
                <span id="cart-count" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- صورة الغلاف -->
    <div id="cover-section" class="pt-16 hidden">
        <div class="w-full h-36 md:h-64 overflow-hidden bg-slate-900 border-b border-slate-800">
            <img id="cover-img" src="" alt="غلاف المتجر" class="w-full h-full object-cover">
        </div>
    </div>

    <!-- بانر الترحيب والعنوان -->
    <section class="py-6 px-4 text-center border-b border-slate-900 pt-24">
        <div class="max-w-3xl mx-auto space-y-2">
            <h1 id="banner-title" class="text-xl md:text-3xl font-black text-white custom-store-font leading-tight">Sports House c Ahmed elghool</h1>
            <p class="text-slate-400 text-xs md:text-sm">أرقى الأطقم، القطع، الاستريزات، أدوات الملاعب وكرات القدم بأفضل الأسعار.</p>
        </div>
    </section>

    <!-- زر قسم الطباعة المميز المستقل -->
    <div class="py-4 px-4 max-w-7xl mx-auto">
        <button onclick="filterCategory('printing', this)" class="printing-special-btn w-full bg-gradient-to-r from-purple-700 via-indigo-600 to-blue-600 hover:from-purple-600 hover:to-blue-500 text-white py-3.5 px-6 rounded-2xl font-black text-sm md:text-base shadow-xl transition duration-300 flex items-center justify-center gap-3 border border-purple-400/30">
            <i class="fas fa-print text-xl text-yellow-300 animate-pulse"></i>
            <span>🖨️ اضغط هنا لعرض أعمال "قسم الطباعة والتصاميم" وحدها</span>
        </button>
    </div>

    <!-- أزرار الأقسام -->
    <div class="sticky top-16 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-900 py-2.5 px-4">
        <div class="max-w-7xl mx-auto flex gap-2 overflow-x-auto pb-1 scrollbar-none">
            <button onclick="filterCategory('all', this)" class="cat-btn theme-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition shadow-md">الكل</button>
            <button onclick="filterCategory('offers', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">🔥 العروض الخاصة</button>
            <button onclick="filterCategory('sets', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">⚽ الأطقم الرياضية</button>
            <button onclick="filterCategory('pieces', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">👕 القطع الفردية</button>
            <button onclick="filterCategory('stretches', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">⚡ الاستريزات</button>
            <button onclick="filterCategory('stadiums', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">🏟️ أدوات الملاعب</button>
            <button onclick="filterCategory('balls', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">⚽ كرات القدم</button>
            <button onclick="filterCategory('sports', this)" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-slate-800">🏃‍♂️ ملابس رياضية متنوعة</button>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="py-8 px-4 max-w-7xl mx-auto">
        <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6"></div>
    </main>

    <!-- زر الواتساب العايم للاستفسارات -->
    <a href="https://wa.me/201050080515?text=مرحباً، أرغب في الاستفسار عن منتجات متجر Sports House" target="_blank" class="fixed bottom-6 left-6 z-50 bg-emerald-600 hover:bg-emerald-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition duration-300 hover:scale-110">
        <i class="fab fa-whatsapp text-3xl"></i>
    </a>

    <!-- نافذة معاينة الصورة -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="relative max-w-4xl w-full max-h-[90vh] flex items-center justify-center">
            <button onclick="closeImageModal()" class="absolute top-2 left-2 text-white text-xl font-bold bg-slate-800/80 w-9 h-9 rounded-full flex items-center justify-center z-20 hover:bg-red-600 transition">✕</button>
            <button onclick="prevModalImage()" class="absolute right-2 top-1/2 -translate-y-1/2 text-white text-xl bg-slate-800/80 w-10 h-10 rounded-full flex items-center justify-center z-20 hover:bg-blue-600 transition shadow-lg">❮</button>
            <img id="modal-img-element" src="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-slate-700">
            <button onclick="nextModalImage()" class="absolute left-2 top-1/2 -translate-y-1/2 text-white text-xl bg-slate-800/80 w-10 h-10 rounded-full flex items-center justify-center z-20 hover:bg-blue-600 transition shadow-lg">❯</button>
            <div id="modal-counter" class="absolute bottom-2 bg-slate-900/80 text-white text-[10px] px-3 py-1 rounded-full border border-slate-700">1 / 1</div>
        </div>
    </div>

    <!-- سلة المشتريات -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-slate-900 w-full max-w-md h-full p-5 flex flex-col justify-between border-l border-slate-800 shadow-2xl">
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 class="text-lg font-black text-blue-400">سلة المشتريات</h2>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                </div>
                <div id="cart-items" class="space-y-3 overflow-y-auto max-h-[60vh]"></div>
            </div>
            <div class="space-y-3 pt-3 border-t border-slate-800">
                <div class="flex justify-between text-base font-bold">
                    <span>الإجمالي:</span>
                    <span id="cart-total" class="text-blue-400">0 ج.م</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="theme-bg w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-xl font-black text-base transition shadow-xl flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i> إتمام الطلب عبر الواتساب
                </button>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-slate-500 border-t border-slate-900 text-xs">
        <p>© 2026 Sports House - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Firebase SDK والفتح اللحظي الفائق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        let currentFilter = 'all';
        let cart = [];
        let globalWhatsapp = "201050080515";
        let primaryColorHex = "#3b82f6";
        let storeTitle = "Sports House";

        let activeModalImages = [];
        let activeModalIndex = 0;

        // الفتح الفوري اللحظي (مثل متجر شروق)
        const cachedData = localStorage.getItem('store_cache_data');
        if (cachedData) {
            try { processStoreData(JSON.parse(cachedData)); } catch(e) {}
        }

        // المزامنة الحية في الخلفية
        onValue(ref(db, 'store'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                localStorage.setItem('store_cache_data', JSON.stringify(data));
                processStoreData(data);
            }
        });

        function processStoreData(data) {
            if(data.storeName) {
                storeTitle = data.storeName;
                document.getElementById('store-logo').innerText = storeTitle;
                document.title = storeTitle;
            }

            if(data.bannerTitle) document.getElementById('banner-title').innerText = data.bannerTitle;
            if(data.bgColor) document.body.style.backgroundColor = data.bgColor;
            if(data.primaryColor) {
                primaryColorHex = data.primaryColor;
                document.getElementById('store-logo').style.color = primaryColorHex;
                document.querySelectorAll('.theme-bg').forEach(el => el.style.backgroundColor = primaryColorHex);
                document.querySelectorAll('.cat-btn.bg-blue-600').forEach(el => el.style.backgroundColor = primaryColorHex);
            }

            const coverSection = document.getElementById('cover-section');
            const coverImg = document.getElementById('cover-img');
            if(data.coverImg) {
                coverImg.src = data.coverImg;
                coverSection.classList.remove('hidden');
            } else { coverSection.classList.add('hidden'); }

            allProducts = data.products ? Object.values(data.products).reverse() : [];
            renderProducts(currentFilter);
        }

        window.filterCategory = function(cat, btnEl) {
            currentFilter = cat;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('text-white');
                btn.style.backgroundColor = '';
                btn.classList.add('bg-slate-900', 'text-slate-300');
            });

            const specialBtn = document.querySelector('.printing-special-btn');
            if (cat === 'printing') {
                specialBtn.classList.add('ring-4', 'ring-yellow-400');
            } else {
                specialBtn.classList.remove('ring-4', 'ring-yellow-400');
                if(btnEl) {
                    btnEl.classList.remove('bg-slate-900', 'text-slate-300');
                    btnEl.classList.add('text-white');
                    btnEl.style.backgroundColor = primaryColorHex;
                }
            }

            renderProducts(cat);
        };

        function renderProducts(cat) {
            const gridEl = document.getElementById('products-grid');
            gridEl.innerHTML = '';
            
            let filtered = [];
            if (cat === 'all') {
                filtered = allProducts.filter(p => (p.category || 'general') !== 'printing');
            } else if (cat === 'printing') {
                filtered = allProducts.filter(p => (p.category || 'general') === 'printing');
            } else {
                filtered = allProducts.filter(p => (p.category || 'general') === cat);
            }

            if(filtered.length > 0) {
                filtered.forEach(prod => {
                    const imagesArr = prod.images && prod.images.length > 0 ? prod.images : [prod.img || 'https://via.placeholder.com/400'];
                    const mainImg = imagesArr[0];
                    const imagesJson = JSON.stringify(imagesArr).replace(/"/g, '&quot;');

                    let thumbsHtml = '';
                    if (imagesArr.length > 1) {
                        thumbsHtml = `<div class="flex gap-1 p-1.5 overflow-x-auto bg-slate-950/80 border-t border-slate-800">`;
                        imagesArr.forEach(imgSrc => {
                            thumbsHtml += `<img src="${imgSrc}" class="w-8 h-8 object-cover rounded cursor-pointer border border-slate-700 hover:border-blue-500 transition" loading="lazy" onclick="changeCardImage(this, '${imgSrc}')">`;
                        });
                        thumbsHtml += `</div>`;
                    }

                    let media = `<div class="h-44 md:h-52 bg-slate-950 relative cursor-pointer flex items-center justify-center overflow-hidden p-1.5">
                        <img src="${mainImg}" alt="${prod.title || ''}" class="product-main-img max-h-full max-w-full object-contain hover:scale-105 transition duration-300" loading="lazy" onclick="openImageModal(${imagesJson}, 0)">
                    </div>`;

                    if(prod.video) {
                        media = `<div class="aspect-video bg-slate-950 overflow-hidden"><iframe src="${prod.video}" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>`;
                    }

                    gridEl.innerHTML += `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
                            <div>
                                ${media}
                                ${thumbsHtml}
                                <div class="p-3 space-y-1.5">
                                    <h3 class="font-bold text-xs md:text-sm text-white truncate">${prod.title || 'منتج رياضي'}</h3>
                                    <p class="font-black text-sm md:text-base" style="color: ${primaryColorHex};">${prod.price || ''}</p>
                                    <div class="flex justify-between text-[10px] md:text-xs text-slate-400">
                                        <span>التفاصيل: <b class="text-slate-200">${prod.sizes || 'متاح'}</b></span>
                                        <span>العدد: <b class="text-emerald-400">${prod.stock || 'متاح'}</b></span>
                                    </div>
                                </div>
                            </div>
                            <div class="p-3 pt-0">
                                <button onclick='addToCart(${JSON.stringify(prod)})' class="w-full text-white py-2 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-1.5 text-xs" style="background-color: ${primaryColorHex};">
                                    <i class="fas fa-cart-plus"></i> إضافة للسلة
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                gridEl.innerHTML = `<p class="text-slate-400 col-span-full text-center py-10 font-bold text-sm">لا توجد منتجات في هذا القسم حالياً.</p>`;
            }
        }

        window.changeCardImage = function(thumbEl, imgSrc) {
            const card = thumbEl.closest('.bg-slate-900\\/90');
            const mainImg = card.querySelector('.product-main-img');
            if(mainImg) {
                mainImg.src = imgSrc;
                const allImgs = Array.from(card.querySelectorAll('img')).map(i => i.src);
                const idx = allImgs.indexOf(imgSrc);
                if(idx !== -1) {
                    mainImg.setAttribute('onclick', `openImageModal(${JSON.stringify(allImgs)}, ${idx})`);
                }
            }
        };

        window.openImageModal = function(imagesArray, index) {
            activeModalImages = imagesArray;
            activeModalIndex = index;
            updateModalDisplay();
            document.getElementById('image-modal').classList.remove('hidden');
        };

        window.updateModalDisplay = function() {
            if(activeModalImages.length > 0) {
                document.getElementById('modal-img-element').src = activeModalImages[activeModalIndex];
                document.getElementById('modal-counter').innerText = `${activeModalIndex + 1} / ${activeModalImages.length}`;
            }
        };

        window.nextModalImage = function() {
            if(activeModalImages.length > 1) {
                activeModalIndex = (activeModalIndex + 1) % activeModalImages.length;
                updateModalDisplay();
            }
        };

        window.prevModalImage = function() {
            if(activeModalImages.length > 1) {
                activeModalIndex = (activeModalIndex - 1 + activeModalImages.length) % activeModalImages.length;
                updateModalDisplay();
            }
        };

        window.closeImageModal = function() { document.getElementById('image-modal').classList.add('hidden'); };

        window.addToCart = function(prod) {
            const cartProd = {...prod, img: (prod.images && prod.images.length > 0) ? prod.images[0] : prod.img};
            cart.push(cartProd);
            updateCartUI();
            toggleCart();
        };

        window.toggleCart = function() { document.getElementById('cart-modal').classList.toggle('hidden'); };

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsEl = document.getElementById('cart-items');
            itemsEl.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                const numericPrice = parseFloat((item.price || '').replace(/[^\d.]/g, '')) || 0;
                total += numericPrice;
                itemsEl.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                        <div class="flex items-center gap-2.5">
                            <img src="${item.img || ''}" class="w-9 h-9 object-cover rounded-lg">
                            <div>
                                <h4 class="font-bold text-xs text-white">${item.title || 'منتج'}</h4>
                                <p class="text-[11px]" style="color: ${primaryColorHex};">${item.price || ''}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-400 text-xs font-bold px-2 py-1">حذف</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total + " ج.م";
        }

        window.removeFromCart = function(idx) { cart.splice(idx, 1); updateCartUI(); };

        window.checkoutWhatsApp = function() {
            if(cart.length === 0) { alert('السلة فارغة!'); return; }
            let totalAmount = 0;
            let msg = `🛒 *طلب جديد من ${storeTitle}*\n━━━━━━━━━━━━━━━━━━━\n`;
            cart.forEach((item, i) => {
                const numericPrice = parseFloat((item.price || '').replace(/[^\d.]/g, '')) || 0;
                totalAmount += numericPrice;
                msg += `*${i+1}. ${item.title || 'منتج'}*\n   • السعر: ${item.price || 'غير محدد'}\n   • التفاصيل: ${item.sizes || 'غير محدد'}\n-----------------------------------\n`;
            });
            msg += `💰 *الإجمالي الكلي: ${totalAmount} ج.م*\n━━━━━━━━━━━━━━━━━━━\n✨ *شكراً لاختياركم متجرنا!*`;
            window.open(`https://wa.me/${globalWhatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
            cart = [];
            updateCartUI();
            toggleCart();
        };
    </script>
</body>
</html>
