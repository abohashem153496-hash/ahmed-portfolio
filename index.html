<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">متجر أحمد للملابس | أحدث صيحات الموضة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- شريط المتجر العلوي -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div id="store-logo" class="text-2xl font-black text-blue-400">متجر أحمد للملابس</div>
            <a id="top-whatsapp" href="https://wa.me/201124793700" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2 font-bold">
                <i class="fab fa-whatsapp text-xl"></i> تواصل وتساب
            </a>
        </div>
    </header>

    <!-- بانر الترحيب للمتجر -->
    <section class="pt-36 pb-12 px-6 text-center bg-gradient-to-b from-blue-950/30 to-slate-950 border-b border-slate-900">
        <div class="max-w-3xl mx-auto space-y-4">
            <h1 class="text-3xl md:text-5xl font-black text-white">أرقى تشكيلة ملابس عصرية</h1>
            <p class="text-slate-400 text-base md:text-lg">اختر منتجك المفضل واطلبه مباشرة عبر الواتساب بضغطة زر واحدة.</p>
        </div>
    </section>

    <!-- قسم عرض منتجات الملابس (سحب مباشر من السحابة) -->
    <main class="py-16 px-6 max-w-7xl mx-auto">
        <h2 class="text-2xl font-black mb-8 border-r-4 border-blue-500 pr-4">منتجات المتجر المتاحة</h2>
        
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- سيتم تحميل المنتجات هنا تفاعلياً -->
            <p class="text-slate-500 col-span-full text-center py-10">جاري تحميل المنتجات من المتجر السحابي...</p>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="py-10 text-center text-slate-500 border-t border-slate-900 text-sm">
        <p>© 2026 جميع الحقوق محفوظة - متجر أحمد محمود أبوهاشم</p>
    </footer>

    <!-- Firebase SDK & Store Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'store'), (snapshot) => {
            const data = snapshot.val();
            let whatsappNum = "201124793700";
            
            if (data) {
                if(data.storeName) {
                    document.getElementById('store-logo').innerText = data.storeName;
                    document.getElementById('site-title').innerText = data.storeName;
                }
                if(data.whatsapp) {
                    whatsappNum = data.whatsapp;
                    document.getElementById('top-whatsapp').href = `https://wa.me/${whatsappNum}`;
                }

                // عرض المنتجات
                const gridEl = document.getElementById('products-grid');
                gridEl.innerHTML = '';

                if(data.products) {
                    Object.values(data.products).forEach(prod => {
                        const waMsg = encodeURIComponent(`مرحباً، أرغب في طلب هذا المنتج:\n- ${prod.title}\n- السعر: ${prod.price}\n- المقاس: ${prod.sizes || 'غير محدد'}`);
                        const waLink = `https://wa.me/${whatsappNum}?text=${waMsg}`;

                        gridEl.innerHTML += `
                            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-blue-500/50 transition">
                                <div>
                                    <div class="h-64 overflow-hidden bg-slate-950">
                                        <img src="${prod.img || 'https://via.placeholder.com/400'}" alt="${prod.title}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                                    </div>
                                    <div class="p-5 space-y-2">
                                        <h3 class="font-bold text-lg text-white">${prod.title}</h3>
                                        <p class="text-blue-400 font-black text-xl">${prod.price}</p>
                                        <p class="text-xs text-slate-400">المقاسات: <span class="text-slate-200 font-bold">${prod.sizes || 'متاح'}</span></p>
                                    </div>
                                </div>
                                <div class="p-5 pt-0">
                                    <a href="${waLink}" target="_blank" class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
                                        <i class="fab fa-whatsapp text-lg"></i> اطلب الآن
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    gridEl.innerHTML = `<p class="text-slate-400 col-span-full text-center py-10">لا توجد منتجات مضافة حالياً. افتح لوحة التحكم وأضف أول منتج!</p>`;
                }
            }
        });
    </script>
</body>
</html>
