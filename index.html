<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">أحمد محمود أبوهاشم | معرض الأعمال الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', darkBg: '#0f172a', cardBg: '#1e293b' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen">

    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div id="logo-text" class="text-2xl font-black text-blue-400">Ahmed Hashem</div>
            <a href="#contact" class="bg-primary hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl transition">تواصل معي</a>
        </div>
    </header>

    <section class="pt-40 pb-24 px-6 text-center">
        <div class="max-w-4xl mx-auto">
            <h1 id="hero-title" class="text-4xl md:text-6xl font-black mb-6 leading-tight">نحول أفكارك إلى واقع رقمي استثنائي</h1>
            <p id="hero-subtitle" class="text-slate-400 text-lg mb-10">نقدم خدمات متكاملة في التصميم البصري، بناء المتاجر، وحلول إكسيل المتقدمة.</p>
        </div>
    </section>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ضع بيانات مشروعك السحابي من فايربيس هنا
        const firebaseConfig = {
            databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" // رابط قاعدتك السحابية الموجود في صورتك
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // جلب البيانات وتحديث الموقع فورياً
        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.title) document.getElementById('site-title').innerText = data.title;
                if(data.logo) document.getElementById('logo-text').innerText = data.logo;
                if(data.heroTitle) document.getElementById('hero-title').innerText = data.heroTitle;
                if(data.heroSubtitle) document.getElementById('hero-subtitle').innerText = data.heroSubtitle;
            }
        });
    </script>
</body>
</html>
