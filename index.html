<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">Sports House c Ahmed elghool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- شريط المتجر العلوي -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div id="store-logo" class="text-xl md:text-2xl font-black text-blue-400">Sports House c Ahmed elghool</div>
            <div class="flex items-center gap-4">
                <!-- زر السلة -->
                <button onclick="toggleCart()" class="relative bg-slate-900 border border-slate-700 hover:border-blue-500 text-white px-4 py-2.5 rounded-xl transition flex items-center gap-2 font-bold">
                    <i class="fas fa-shopping-cart text-lg text-blue-400"></i>
                    <span>السلة</span>
                    <span id="cart-count" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- بانر الترحيب للمتجر -->
    <section class="pt-36 pb-12 px-6 text-center bg-gradient-to-b from-blue-950/30 to-slate-950 border-b border-slate-900">
        <div class="max-w-3xl mx-auto space-y-3">
            <h1 class="text-3xl md:text-5xl font-black text-white">Sports House c Ahmed elghool</h1>
            <p class="text-slate-400 text-base">وجهتك الأولى لأرقى الملابس الرياضية، الأطقم، القطع، الاستريزات والعروض الحصرية.</p>
        </div>
    </section>

    <!-- أزرار الأقسام (التصنيفات) -->
    <div class="sticky top-20 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-900 py-4 px-6">
        <div class="max-w-7xl mx-auto flex gap-3 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterCategory('all')" class="cat-btn bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition shadow-md">الكل</button>
            <button onclick="filterCategory('offers')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition border border-slate-800">🔥 العروض</button>
            <button onclick="filterCategory('sets')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition border border-slate-800">⚽ الأطقم</button>
            <button onclick="filterCategory('pieces')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition border border-slate-800">👕 القطع</button>
            <button onclick="filterCategory('stretches')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition border border-slate-800">⚡ الاستريزات</button>
            <button onclick="filterCategory('sports')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition border border-slate-800">🏃‍♂️ ملابس رياضية</button>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="py-12 px-6 max-w-7xl mx-auto">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-slate-500 col-span-full text-center py-10">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- نافذة سلة المشتريات الجانبية (Cart Modal) -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-slate-900 w-full max-w-md h-full p-6 flex flex-col justify-between border-l border-slate-800 shadow-2xl">
            <div class="space-y-6">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h2 class="text-xl font-black text-blue-400">سلة المشتريات</h2>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
                </div>
                <div id="cart-items" class="space-y-4 overflow-y-auto max-h-[60vh]">
                    <!-- المنتجات المضافة للسلة -->
                </div>
            </div>
            <div class="space-y-4 pt-4 border-t border-slate-800">
                <div class="flex justify-between text-lg font-bold">
                    <span>الإجمالي:</span>
                    <span id="cart-total" class="text-blue-400">0 ج.م</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-black text-lg transition shadow-xl flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-2xl"></i> إتمام الطلب عبر الواتساب
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="py-10 text-center text-slate-500 border-t border-slate-900 text-sm">
        <p>© 2026 Sports House c Ahmed elghool - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Firebase SDK & Store Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://car-orders-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        let currentFilter = 'all';
        let cart = [];
        let globalWhatsapp = "201124793700";

        onValue(ref(db, 'store'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.storeName) {
                    document.getElementById('store-logo').innerText = data.storeName;
                    document.getElementById('site-title').innerText = data.storeName;
                }
                if(data.whatsapp) globalWhatsapp = data.whatsapp;

                allProducts = data.products ? Object.values(data.products) : [];
                renderProducts(currentFilter);
            }
        });

        window.filterCategory = function(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-900', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-900', 'text-slate-300');
            event.target.classList.add('bg-blue-600', 'text-white');
            renderProducts(cat);
        };

        function renderProducts(cat) {
            const gridEl = document.getElementById('products-grid');
            gridEl.innerHTML = '';

            const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);

            if(filtered.length > 0) {
                filtered.forEach((prod, index) => {
                    gridEl.innerHTML += `
                        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-blue-500/50 transition">
                            <div>
                                <div class="h-64 overflow-hidden bg-slate-950 relative">
                                    <img src="${prod.img || 'https://via.placeholder.com/400'}" alt="${prod.title}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                                </div>
                                <div class="p-5 space-y-2">
                                    <h3 class="font-bold text-lg text-white">${prod.title}</h3>
                                    <p class="text-blue-400 font-black text-xl">${prod.price}</p>
                                    <p class="text-xs text-slate-400">المقاسات: <span class="text-slate-200 font-bold">${prod.sizes || 'متاح'}</span></p>
                                </div>
                            </div>
                            <div class="p-5 pt-0">
                                <button onclick='addToCart(${JSON.stringify(prod)})' class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
                                    <i class="fas fa-cart-plus"></i> إضافة إلى السلة
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                gridEl.innerHTML = `<p class="text-slate-400 col-span-full text-center py-10">لا توجد منتجات في هذا القسم حالياً.</p>`;
            }
        }

        window.addToCart = function(prod) {
            cart.push(prod);
            updateCartUI();
            alert('تمت إضافة المنتج إلى السلة بنجاح! 🛒');
        };

        window.toggleCart = function() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        };

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsEl = document.getElementById('cart-items');
            itemsEl.innerHTML = '';
            
            let total = 0;
            cart.forEach((item, idx) => {
                total += parseFloat(item.price) || 0;
                itemsEl.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
                        <div class="flex items-center gap-3">
                            <img src="${item.img || ''}" class="w-10 h-10 object-cover rounded-lg">
                            <div>
                                <h4 class="font-bold text-xs">${item.title}</h4>
                                <p class="text-xs text-blue-400">${item.price}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-400 text-xs font-bold px-2 py-1">حذف</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total + " ج.م / ر.س";
        }

        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        };

        window.checkoutWhatsApp = function() {
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let msg = `مرحباً، أرغب في طلب المنتجات التالية من Sports House:\n`;
            cart.forEach((item, i) => {
                msg += `${i+1}. ${item.title} - السعر: ${item.price}\n`;
            });
            const url = `https://wa.me/${globalWhatsapp}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };
    </script>
</body>
</html>
